<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
</head>
<body style="font-family:Arial,Helvetica,sans-serif; margin:0; padding:20px; background:#ffffff; color:#333333;">

<!-- Outer container table for Word/PDF compatibility -->
<table cellpadding="0" cellspacing="0" border="0" style="max-width:900px; margin:0 auto;">
<tr><td style="padding:0;">

    <!-- ===== HEADER ===== -->
    <table cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-bottom:20px;">
    <tr>
        <td style="background:#336699; padding:18px 24px;">
            <h1 style="font-family:Arial,Helvetica,sans-serif; color:#ffffff; font-size:20px; margin:0;">{{TITLE}}</h1>
            <p style="font-family:Arial,Helvetica,sans-serif; color:#d0d0d0; font-size:11px; margin:4px 0 0 0;">{{DATE}}</p>
        </td>
    </tr>
    </table>

    <!-- ===== KEY METRICS ===== -->
    <h2 style="font-family:Arial,Helvetica,sans-serif; color:#2c3e50; border-bottom:2px solid #336699; padding-bottom:6px; margin-top:16px; margin-bottom:12px; font-size:15px;">Key Metrics</h2>
    {{METRICS_TABLE}}

    <!-- ===== COMPLIANCE POSTURE ===== -->
    <h2 style="font-family:Arial,Helvetica,sans-serif; color:#2c3e50; border-bottom:2px solid #336699; padding-bottom:6px; margin-top:20px; margin-bottom:12px; font-size:15px;">Compliance Posture</h2>
    {{COMPLIANCE_STATEMENT}}

    <!-- ===== ACTION ITEMS ===== -->
    <h2 style="font-family:Arial,Helvetica,sans-serif; color:#2c3e50; border-bottom:2px solid #336699; padding-bottom:6px; margin-top:20px; margin-bottom:12px; font-size:15px;">Action Items</h2>
    {{ACTION_ITEMS}}

    <!-- ===== DOMAIN SUMMARY ===== -->
    <h2 style="font-family:Arial,Helvetica,sans-serif; color:#2c3e50; border-bottom:2px solid #336699; padding-bottom:6px; margin-top:20px; margin-bottom:12px; font-size:15px;">Domain Summary</h2>
    {{DOMAIN_SUMMARY}}

    <!-- ===== FOOTER ===== -->
    <table cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-top:24px; border-top:1px solid #dddddd;">
    <tr>
        <td style="padding:10px 0; text-align:center; color:#999999; font-family:Arial,Helvetica,sans-serif; font-size:10px;">
            {{FOOTER}}
        </td>
    </tr>
    </table>

</td></tr>
</table>

</body>
</html>
